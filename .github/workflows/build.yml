name: Build
on:
  push:
    branches:
      - ea
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Java 11
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: 11
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        run: |
          mvn \
            --show-version \
            --errors \
            --batch-mode \
            verify

  build-all:
    needs: build

    strategy:
      fail-fast: true
      matrix:
        os: [ ubuntu-latest  ]
        java:
          - java-version: 17
            distribution: temurin
          - java-version: 21
            distribution: temurin
          - java-version: 25
            distribution: temurin
          - java-version: 25
            distribution: semeru

    name: Java ${{ matrix.java.java-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK ${{ matrix.java.java-version }}
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java.java-version }}
          distribution: ${{ matrix.java.distribution }}
      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        run: |
          mvn \
            --show-version \
            --errors \
            --batch-mode \
            verify
